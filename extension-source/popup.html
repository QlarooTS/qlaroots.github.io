<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 260px; padding: 14px; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 8px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; margin: 8px 0; }
    button { width: 100%; padding: 8px; background: #2563eb; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .note { font-size: 12px; color: #666; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Zapret Proxy</h1>
  <label>URL сервера (Arena):</label>
  <input id="server" type="text" placeholder="https://8000-isx0bdbob8dt55f541oxm.e2b.app">
  <button id="save">Сохранить</button>
  <button id="open" style="background:#10b981">Открыть текущую страницу</button>
  <div class="note">
    Сервер уже запущен в Arena (Zapret v72.13). Скопируй ссылку из превью (порт 8000).
  </div>
  <script>
    const input = document.getElementById('server');
    const saveBtn = document.getElementById('save');
    const openBtn = document.getElementById('open');
    chrome.storage.local.get(['serverUrl'], r => {
      if (r.serverUrl) input.value = r.serverUrl;
    });
    saveBtn.onclick = () => {
      chrome.storage.local.set({ serverUrl: input.value }, () => {
        alert('Сохранено!');
      });
    };
    openBtn.onclick = async () => {
      const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
      if (!input.value) return alert('Введите URL сервера!');
      const url = input.value + '/fetch?url=' + encodeURIComponent(tab.url);
      chrome.tabs.update(tab.id, { url });
    };
  </script>
</body>
</html>
